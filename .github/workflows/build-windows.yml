name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/desktop/**'
      - 'packages/muya/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    # windows-latest now points at Windows Server 2025, whose Visual Studio 18
    # toolchain is not yet recognized by the node-gyp bundled with pnpm. The
    # 2022 image still provides the VS 17 C++ workload the native modules need.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 package
        run: pnpm run build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: marktext-win-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
