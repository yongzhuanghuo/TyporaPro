name: Build Desktop Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/desktop/**'
      - 'packages/muya/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    # windows-latest now points at Windows Server 2025, whose Visual Studio 18
    # toolchain is not yet recognized by the node-gyp bundled with pnpm. The
    # 2022 image still provides the VS 17 C++ workload the native modules need.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 installer
        run: pnpm run build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: typorapro-win-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  macos-universal:
    # arm64 macOS runners are not available to this repository, so build the
    # universal app on the Intel image and cross-compile the arm64 slice.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS app
        run: pnpm run build:mac:universal

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: typorapro-mac-universal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
